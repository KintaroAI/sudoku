<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quantum Sudoku – Restore Superposition (Final → Uncertainty)</title>

<!-- Base styles (same as sudoku.html) -->
<link rel="stylesheet" href="blocks_lib.css">
<link rel="stylesheet" href="sudoku.css">

<style>
  /* Minimal UI styling for the controls (board styles live in sudoku.css) */
  .controls { display:grid; gap:10px; grid-template-columns: repeat(12, 1fr); align-items:center; }
  .controls .group { grid-column: span 12; display:flex; flex-wrap: wrap; gap:10px; align-items:center; }
  .btn { background:#2b3036; color:var(--text); border:1px solid #5a646e; border-radius:10px; padding:8px 12px; cursor:pointer; }
  .btn:active { transform: translateY(1px); }
  .pill { background:#2b3036; padding:6px 10px; border-radius:999px; border:1px solid #5a646e; font-size:13px; }
  input[type="range"] { width: 260px; }
  .stat { font-variant-numeric: tabular-nums; }
  .hint { opacity:.75; font-size:13px; }
  /* Page layout wrapper mirrors sudoku.html */
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui, Segoe UI, Roboto, Arial; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .canvas { background:#111519; border:1px solid #293039; border-radius:14px; overflow:hidden; }
  #board { height: 950px; }
</style>
</head>
<body>
  <div class="wrap">
    <h2>Quantum Sudoku — Final State ➜ Restoring Superposition</h2>

    <div class="controls">
      <div class="group">
        <button id="loadSolution" class="btn">Load Final State (Solution)</button>
        <button id="clearAll" class="btn">Clear All (Max Uncertainty)</button>
        <button id="stepBack" class="btn">Step Back in Time (−1)</button>
        <button id="stepForward" class="btn">Step Forward (+1, if deducible)</button>

        <span class="pill">Autosolver: <strong id="autosolverState">ON</strong></span>
        <button id="toggleAutosolver" class="btn">Toggle Autosolver</button>

        <span class="pill">Auto Hints: <strong id="autohintsState">ON</strong></span>
        <button id="toggleAutoHints" class="btn">Toggle Auto Hints</button>
      </div>

      <div class="group">
        <label for="entropy">Entropy (cells to erase):</label>
        <input id="entropy" type="range" min="0" max="81" value="20" step="1">
        <span class="pill"><span class="stat" id="entropyVal">20</span> cells</span>
        <button id="applyEntropy" class="btn">Apply Entropy</button>

        <span class="pill">Filled: <span class="stat" id="filledCount">0</span></span>
        <span class="pill">Empty: <span class="stat" id="emptyCount">81</span></span>
        <span class="hint">Tip: “Final State” loads a full valid 9×9; entropy erases cells uniformly at random.</span>
      </div>
    </div>

    <div id="board" class="canvas"></div>
  </div>

  <!-- Core libs (same order as sudoku.html) -->
  <script src="blocks_lib.js"></script>
  <script src="sudoku.js"></script>

  <script>
    (function () {
      // A known-good 9×9 Sudoku solution
      const fullSolutionRows = [
        [5,3,4,6,7,8,9,1,2],
        [6,7,2,1,9,5,3,4,8],
        [1,9,8,3,4,2,5,6,7],
        [8,5,9,7,6,1,4,2,3],
        [4,2,6,8,5,3,7,9,1],
        [7,1,3,9,2,4,8,5,6],
        [9,6,1,5,3,7,2,8,4],
        [2,8,7,4,1,9,6,3,5],
        [3,4,5,2,8,6,1,7,9]
      ];

      // Map rows -> { "R#C#": value }
      function toCorrectValues(rows) {
        const map = {};
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            map[`R${r+1}C${c+1}`] = rows[r][c];
          }
        }
        return map;
      }

      // Initialize a 9×9 board via your sudoku.js initializer
      const board = initSudoku("#board", {
        subRows: 3,
        subCols: 3,
        singleSection: false,
        clickToSetAnswer: true,
        autoHints: true,
        autosolver: true,
        hintShake: false,
        correctValues: {} // we'll load solution values on demand
      });

      // Helpers using run_blocks API that sudoku.js exposes via `board.block(id)`
      const getBlk = (r, c) => board.block(`R${r}C${c}`);
      const setVal = (r, c, v) => { const b = getBlk(r,c); if (b) b.setValue(v); };
      const clearVal = (r, c) => setVal(r,c, null);

      // UI bindings
      const $ = id => document.getElementById(id);
      const autosolverState = $("autosolverState");
      const autohintsState = $("autohintsState");
      const entropy = $("entropy");
      const entropyVal = $("entropyVal");
      const filledCount = $("filledCount");
      const emptyCount = $("emptyCount");

      function updateCounters() {
        let filled = 0;
        for (let r = 1; r <= 9; r++) {
          for (let c = 1; c <= 9; c++) {
            const b = getBlk(r,c);
            if (b && b._value != null) filled++;
          }
        }
        filledCount.textContent = filled;
        emptyCount.textContent = 81 - filled;
      }

      // Load final solved state (certainty/intelligence)
      function loadSolution() {
        const cv = toCorrectValues(fullSolutionRows);
        for (let r = 1; r <= 9; r++) {
          for (let c = 1; c <= 9; c++) {
            const id = `R${r}C${c}`;
            const b = board.block(id);
            if (b) {
              b._correctValue = cv[id];  // keep validation highlighting
              b.setValue(cv[id]);        // set actual value
            }
          }
        }
        board.sudoku.updateAllHints();
        updateCounters();
      }

      // Clear all values (maximum uncertainty)
      function clearAll() {
        for (let r = 1; r <= 9; r++) {
          for (let c = 1; c <= 9; c++) clearVal(r,c);
        }
        board.sudoku.updateAllHints();
        updateCounters();
      }

      // Apply entropy: erase N random filled cells
      function applyEntropy(n) {
        const filled = [];
        for (let r = 1; r <= 9; r++) {
          for (let c = 1; c <= 9; c++) {
            const b = getBlk(r,c);
            if (b && b._value != null) filled.push([r,c]);
          }
        }
        // Shuffle and clear up to n
        for (let i = filled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [filled[i], filled[j]] = [filled[j], filled[i]];
        }
        const k = Math.min(n, filled.length);
        for (let i = 0; i < k; i++) {
          const [r,c] = filled[i];
          clearVal(r,c);
        }
        board.sudoku.updateAllHints();
        updateCounters();
      }

      function stepBack(){ applyEntropy(1); }

      // Let autosolver fill any single-candidate cells by forcing a hint refresh
      function stepForward() {
        const wasAutoHints = board.sudoku.getAutoHints();
        board.sudoku.setAutoHints(true);
        board.sudoku.updateAllHints();
        board.sudoku.setAutoHints(wasAutoHints);
        updateCounters();
      }

      // UI toggles
      let autosolverOn = true;
      function toggleAutosolver(){ autosolverOn = !autosolverOn; autosolverState.textContent = autosolverOn ? "ON" : "OFF"; }
      function toggleAutoHints(){ const cur = board.sudoku.getAutoHints(); board.sudoku.setAutoHints(!cur); autohintsState.textContent = !cur ? "ON" : "OFF"; board.sudoku.updateAllHints(); }

      // Wire events
      $("loadSolution").addEventListener("click", loadSolution);
      $("clearAll").addEventListener("click", clearAll);
      $("applyEntropy").addEventListener("click", () => applyEntropy(parseInt(entropy.value,10) || 0));
      $("toggleAutosolver").addEventListener("click", toggleAutosolver);
      $("toggleAutoHints").addEventListener("click", toggleAutoHints);
      $("stepBack").addEventListener("click", stepBack);
      $("stepForward").addEventListener("click", () => { if (autosolverOn) stepForward(); });
      entropy.addEventListener("input", () => entropyVal.textContent = entropy.value);

      // Boot empty + counters
      clearAll();
    })();
  </script>
</body>
</html>
