<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blocks Sudoku</title>
<link rel="stylesheet" href="blocks_lib.css">
<style>
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui, Segoe UI, Roboto, Arial; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .canvas { background:#111519; border:1px solid #293039; border-radius:14px; overflow:hidden; }
  #sudoku { height: 950px; }

  /* Active/selected cell styling */
  .block.active rect {
    stroke: #8bd1ff;
    stroke-width: 3.5;
    filter: drop-shadow(0 0 6px rgba(139,209,255,.45));
  }


  .block.correct rect {
    stroke: #4CAF50;
    stroke-width: 2;
    filter: drop-shadow(0 0 1px rgba(76,175,80,.6));
  }

  .block.incorrect rect {
    stroke: #F44336;
    stroke-width: 2;
    filter: drop-shadow(0 0 1px rgba(244,67,54,.6));
  }

  /* Validation feedback borders */
  .block.active.correct rect {
    stroke: #4CAF50;
    stroke-width: 4;
    filter: drop-shadow(0 0 8px rgba(76,175,80,.6));
  }

  .block.active.incorrect rect {
    stroke: #F44336;
    stroke-width: 4;
    filter: drop-shadow(0 0 8px rgba(244,67,54,.6));
  }

  /* Hints (3x3 pencil marks) */
  .sudoku-hints text {
    font-size: 23px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
    opacity: .95;
    pointer-events: none;
  }
  /* Per-digit hint colors (tweak to taste) */
  .sudoku-hint-1 { fill: #F44336; } /* red */
  .sudoku-hint-2 { fill: #E91E63; } /* pink */
  .sudoku-hint-3 { fill: #9C27B0; } /* purple */
  .sudoku-hint-4 { fill: #3F51B5; } /* indigo */
  .sudoku-hint-5 { fill: #2196F3; } /* blue */
  .sudoku-hint-6 { fill: #009688; } /* teal */
  .sudoku-hint-7 { fill: #4CAF50; } /* green */
  .sudoku-hint-8 { fill: #FFC107; } /* amber */
  .sudoku-hint-9 { fill: #FF9800; } /* orange */

  /* Thicker subgrid guides (drawn as note blocks so they sit on top) */
  .subgrid-line { fill:none; stroke:#5a646e; stroke-width:3.5; opacity:.9; }

  /* Big number in a cell */
  .sudoku-value {
    font-size: 44px;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: middle;
    opacity: .98;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h2>Quantum Sudoku - https://github.com/KintaroAI/sudoku</h2>
    <div id="sudoku" class="canvas"></div>
  </div>

  <script src="blocks_lib.js"></script>
  <script>
    // ---- Sudoku bootstrap ----
    (function () {
      const SVG_NS = "http://www.w3.org/2000/svg";
      /**
       * Initialize a Sudoku board.
       * @param {String} container - CSS selector (e.g., "#sudoku")
       * @param {Object} opts
       *   subRows: subgrid rows (e.g., 2 in a 2x2 -> 4x4 board)
       *   subCols: subgrid cols (e.g., 2 in a 2x2 -> 4x4 board)
       *   cellSize: block width/height (px)
       *   gap: spacing between cells (px)
       *   margin: outer margin inside canvas (px)
       *   singleSection: if true, render only subRows x subCols cells instead of NxN board
       *   maxHint: maximum hint number (if null, defaults to subRows * subCols)
       *   autosolver: if true, automatically set cell values when only one hint remains
       */
      function initSudoku(container, {
        subRows = 2,
        subCols = 2,
        cellSize = 100,
        gap = 8,
        margin = 15,
        hintShake = true,
        correctValues = {},
        singleSection = false,
        maxHint = null,
        autosolver = false
      } = {}) {
        const N = subRows * subCols; // classic board size
        const ROWS = singleSection ? subRows : N;    // <-- NEW
        const COLS = singleSection ? subCols : N;    // <-- NEW
        const boardPx = margin*2 + COLS*cellSize + (COLS-1)*gap; // width
        const boardPy = margin*2 + ROWS*cellSize + (ROWS-1)*gap; // height
        // Calculate maximum hint number based on section size or provided maxHint
        const effectiveMaxHint = maxHint !== null ? maxHint : (subRows * subCols);

        const api = run_blocks(container, (b) => {
          // Helper: lay out ROWSxCOLS cells as blocks
          const blocks = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const id = `R${r+1}C${c+1}`;
              const x = margin + c*(cellSize + gap);
              const y = margin + r*(cellSize + gap);
              const blk = b.addBlock(id, x, y, cellSize, cellSize, "");
              blocks.push(blk);

              // Click to select (single-active behavior)
              blk.g.addEventListener("click", (e) => {
                e.stopPropagation();
                setActive(blk.id);
              });

              // Create a "hints" overlay group inside each block
              const gHints = document.createElementNS("http://www.w3.org/2000/svg", "g");
              gHints.setAttribute("class", "sudoku-hints");
              blk.g.appendChild(gHints);
              blk._hintsEl = gHints;
              blk._hintIntervals = []; // Store interval IDs for cleanup

              // API method: update hints (Set<number> or array)
              blk.setHints = (vals) => {
                blk._currentHints = vals; // Store current hints for re-rendering
                renderHints(blk, vals);
              };

              // Big centered value text
              const gVal = document.createElementNS(SVG_NS, "text");
              gVal.setAttribute("x", blk.x + blk.w/2);
              gVal.setAttribute("y", blk.y + blk.h/2);
              gVal.style.display = "none";          // hidden until a value is set
              blk.g.appendChild(gVal);
              blk._valueEl = gVal;
              blk._value = null;
              blk._correctValue = correctValues[blk.id] || null;

              // API method: set / clear the big value (number 1..9 or null)
              blk.setValue = (v) => {
                if (v === null || v === undefined || Number.isNaN(v)) {
                  blk._value = null;
                  blk._valueEl.textContent = "";
                  blk._valueEl.style.display = "none";
                  // Show hints back
                  blk._hintsEl.style.display = "";
                  // Clear validation classes
                  blk.g.classList.remove("correct", "incorrect");
                  // Re-center value in case of future resize/move
                  blk._valueEl.setAttribute("x", blk.x + blk.w/2);
                  blk._valueEl.setAttribute("y", blk.y + blk.h/2);
                  
                  // Update hints for all cells when a value is cleared
                  updateAllHints();
                  return;
                }
                const n = Number(v);
                if (n >= 1 && n <= 9) {
                  blk._value = n;
                  blk._valueEl.textContent = String(n);
                  blk._valueEl.style.display = "";
                  
                  // Add hint color class based on number
                  blk._valueEl.setAttribute("class", `sudoku-value sudoku-hint-${n}`);
                  
                  // Clear hint intervals when value is set
                  if (blk._hintIntervals) {
                    blk._hintIntervals.forEach(intervalId => clearInterval(intervalId));
                    blk._hintIntervals = [];
                  }
                  
                  // Hide hints when value is present
                  blk._hintsEl.style.display = "none";
                  
                  // Validation feedback
                  if (blk._correctValue !== null) {
                    // Clear previous validation classes
                    blk.g.classList.remove("correct", "incorrect");
                    // Add appropriate validation class
                    if (n === blk._correctValue) {
                      blk.g.classList.add("correct");
                    } else {
                      blk.g.classList.add("incorrect");
                    }
                  }
                  
                  // Re-center (defensive)
                  blk._valueEl.setAttribute("x", blk.x + blk.w/2);
                  blk._valueEl.setAttribute("y", blk.y + blk.h/2);
                  
                  // Update hints for all cells when a value is set
                  updateAllHints();
                }
              };
            }
          }

          // --- NEW: connect nearest neighbors with thin arrowless lines ---
          const connectNeighbors = () => {
            const edgeT = 0; // center of the edge
            for (let r = 0; r < ROWS; r++) {
              for (let c = 0; c < COLS; c++) {
                const id = `R${r+1}C${c+1}`;
                // Right neighbor
                if (c+1 < COLS) {
                  const idR = `R${r+1}C${c+2}`;
                  b.connect({
                    start: { block: id,  edge: "right",  t: edgeT },
                    end:   { block: idR, edge: "left",   t: edgeT },
                    className: "neighbor",
                    width: 1.5,
                    arrow: false,       // <-- no arrowhead
                    sparks: 0,
                    outOffset: 1.5
                  });
                }
                // Bottom neighbor
                if (r+1 < ROWS) {
                  const idB = `R${r+2}C${c+1}`;
                  b.connect({
                    start: { block: id,  edge: "bottom", t: edgeT },
                    end:   { block: idB, edge: "top",    t: edgeT },
                    className: "neighbor",
                    width: 1.5,
                    arrow: false,       // <-- no arrowhead
                    sparks: 0,
                    outOffset: 1.5
                  });
                }
              }
            }
          };
          connectNeighbors();

          // Canvas click clears selection
          b.svg.addEventListener("click", () => setActive(null));

          // Selection management
          let activeId = null;
          function setActive(id) {
            if (activeId && b.block(activeId)) {
              b.block(activeId).g.classList.remove("active");
            }
            activeId = id;
            if (id && b.block(id)) {
              b.block(id).g.classList.add("active");
            }
          }

          // Add a global key handler for digit input, clearing, and navigation
          document.addEventListener("keydown", (e) => {
            // ESC key to clear selection
            if (e.key === "Escape") {
              setActive(null);
              e.preventDefault();
              return;
            }

            // Arrow key navigation
            if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
              e.preventDefault();
              
              // If no block is selected, select R1C1 (top-left)
              if (!activeId) {
                setActive("R1C1");
                return;
              }

              // Parse current position
              const currentMatch = activeId.match(/R(\d+)C(\d+)/);
              if (!currentMatch) return;
              
              let currentRow = parseInt(currentMatch[1], 10);
              let currentCol = parseInt(currentMatch[2], 10);

              // Calculate new position based on arrow direction
              switch (e.key) {
                case "ArrowUp":
                  currentRow = Math.max(1, currentRow - 1);
                  break;
                case "ArrowDown":
                  currentRow = Math.min(ROWS, currentRow + 1);
                  break;
                case "ArrowLeft":
                  currentCol = Math.max(1, currentCol - 1);
                  break;
                case "ArrowRight":
                  currentCol = Math.min(COLS, currentCol + 1);
                  break;
              }

              // Select the new block
              const newId = `R${currentRow}C${currentCol}`;
              if (b.block(newId)) {
                setActive(newId);
              }
              return;
            }

            // Only process digit and delete keys if a block is selected
            if (!activeId) return;
            const blk = b.block(activeId);
            if (!blk) return;

            // Digit keys 1..9
            if (e.key >= "1" && e.key <= "9") {
              blk.setValue(parseInt(e.key, 10));
              e.preventDefault();
              return;
            }

            // Delete / Backspace to clear
            if (e.key === "Backspace" || e.key === "Delete") {
              blk.setValue(null);
              e.preventDefault();
            }
          });

          // Calculate optimal grid dimensions for hints
          function calculateGridDimensions(hintCount) {
            if (hintCount <= 0) return { rows: 0, cols: 0 };
            if (hintCount === 1) return { rows: 1, cols: 1 };
            if (hintCount <= 2) return { rows: 1, cols: 2 };
            if (hintCount <= 4) return { rows: 2, cols: 2 };
            if (hintCount <= 6) return { rows: 2, cols: 3 };
            if (hintCount <= 9) return { rows: 3, cols: 3 };
            if (hintCount <= 12) return { rows: 3, cols: 4 };
            if (hintCount <= 16) return { rows: 4, cols: 4 };
            if (hintCount <= 20) return { rows: 4, cols: 5 };
            if (hintCount <= 25) return { rows: 5, cols: 5 };
            if (hintCount <= 30) return { rows: 5, cols: 6 };
            if (hintCount <= 36) return { rows: 6, cols: 6 };
            
            // For very large numbers, use a more compact grid
            const sqrt = Math.sqrt(hintCount);
            const rows = Math.ceil(sqrt);
            const cols = Math.ceil(hintCount / rows);
            return { rows, cols };
          }

          // Render hints: draw a flexible grid of tiny digits based on hint count
          function renderHints(blk, values) {
            const set = new Set(values || []);
            const g = blk._hintsEl;
            
            // Clear any existing intervals to prevent memory leaks
            if (blk._hintIntervals) {
              blk._hintIntervals.forEach(intervalId => clearInterval(intervalId));
              blk._hintIntervals = [];
            }
            
            g.replaceChildren();

           
            // Filter out hints that exceed the maximum
            const filteredValues = Array.from(set).filter(val => val >= 1 && val <= effectiveMaxHint);
            const filteredSet = new Set(filteredValues);
            
            if (filteredSet.size === 0) {
              if (blk._value != null) {
                blk._hintsEl.style.display = "none";
              }
              return;
            }

            // Calculate optimal grid dimensions based on the maximum hint number
            const { rows, cols } = calculateGridDimensions(effectiveMaxHint);

            // Cell inner box
            const pad = 10; // inner padding
            const w = blk.w - pad*2;
            const h = blk.h - pad*2;

            const cellW = w / cols;
            const cellH = h / rows;

            // Position hints based on their actual numbers (1-based indexing)
            for (const hintNum of filteredSet) {
              // Convert 1-based hint number to 0-based grid position
              const gridIndex = hintNum - 1;
              const row = Math.floor(gridIndex / cols);
              const col = gridIndex % cols;
              const cx = blk.x + pad + col*cellW + cellW/2;
              const cy = blk.y + pad + row*cellH + cellH/2;
              
              const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
              t.setAttribute("x", cx);
              t.setAttribute("y", cy);
              t.setAttribute("class", `sudoku-hint-${hintNum}`);
              t.textContent = hintNum.toString();
              
              // Add random shake animation (if enabled)
              if (hintShake) {
                const shakeAmount = 0.5; // pixels
                const shakeSpeed = 0.8 + Math.random() * 0.4; // 0.8-1.2 seconds
                const shakeDelay = Math.random() * 2; // 0-2 seconds delay
                
                const animateShake = () => {
                  const offsetX = (Math.random() - 0.5) * shakeAmount * 2;
                  const offsetY = (Math.random() - 0.5) * shakeAmount * 2;
                  t.setAttribute("x", cx + offsetX);
                  t.setAttribute("y", cy + offsetY);
                };
                
                // Start shaking after delay
                setTimeout(() => {
                  const intervalId = setInterval(animateShake, 1000 / (60 * shakeSpeed)); // 60fps * speed
                  blk._hintIntervals.push(intervalId); // Store interval ID for cleanup
                }, shakeDelay * 1000);
              }
              
              g.appendChild(t);
            }
            
            // After you finish populating hints:
            if (blk._value != null) {
              blk._hintsEl.style.display = "none";
            }
          }

          // Subgrid guide lines (as "notes" so they sit topmost)
          if (!singleSection) {
            drawSubgridGuides(b, { N, subRows, subCols, margin, cellSize, gap });
          }

          // Helper function to get all numbers in a row
          function getNumbersInRow(row) {
            const numbers = [];
            for (let c = 1; c <= COLS; c++) {
              const blockId = `R${row}C${c}`;
              const blk = b.block(blockId);
              if (blk && blk._value !== null) {
                numbers.push(blk._value);
              }
            }
            return numbers;
          }

          // Helper function to get all numbers in a column
          function getNumbersInColumn(col) {
            const numbers = [];
            for (let r = 1; r <= ROWS; r++) {
              const blockId = `R${r}C${col}`;
              const blk = b.block(blockId);
              if (blk && blk._value !== null) {
                numbers.push(blk._value);
              }
            }
            return numbers;
          }

          // Helper function to get all numbers in a 3x3 section
          function getNumbersInSection(row, col) {
            const numbers = [];
            // Calculate which 3x3 section this cell belongs to
            const sectionStartRow = Math.floor((row - 1) / subRows) * subRows + 1;
            const sectionStartCol = Math.floor((col - 1) / subCols) * subCols + 1;
            
            for (let r = sectionStartRow; r < sectionStartRow + subRows; r++) {
              for (let c = sectionStartCol; c < sectionStartCol + subCols; c++) {
                const blockId = `R${r}C${c}`;
                const blk = b.block(blockId);
                if (blk && blk._value !== null) {
                  numbers.push(blk._value);
                }
              }
            }
            return numbers;
          }

          // Helper function to get valid hints for a cell based on Sudoku rules
          function getValidHints(row, col) {
            const existingNumbers = new Set([
              ...getNumbersInRow(row),
              ...getNumbersInColumn(col),
              ...getNumbersInSection(row, col)
            ]);
            
            const validHints = [];
            for (let i = 1; i <= effectiveMaxHint; i++) {
              if (!existingNumbers.has(i)) {
                validHints.push(i);
              }
            }
            return validHints;
          }

          // Helper function to update hints for all cells
          function updateAllHints() {
            for (let r = 1; r <= ROWS; r++) {
              for (let c = 1; c <= COLS; c++) {
                const blockId = `R${r}C${c}`;
                const blk = b.block(blockId);
                if (blk && blk._value === null) { // Only update hints for empty cells
                  const validHints = getValidHints(r, c);
                  blk.setHints(validHints);
                  
                  // Autosolver: if enabled and only one hint remains, set the value
                  if (autosolver && validHints.length === 1) {
                    blk.setValue(validHints[0]);
                  }
                }
              }
            }
          }

          // Initial hint generation
          updateAllHints();

          // Expose a tiny control API on the diagram object for later tinkering
          b.sudoku = {
            setActive,
            setHints(id, arr) { const blk = b.block(id); if (blk) blk.setHints(arr); },
            clearHints(id) { const blk = b.block(id); if (blk) blk.setHints([]); },
            updateAllHints,
            getValidHints(row, col) { return getValidHints(row, col); },
            size: { rows: ROWS, cols: COLS }
          };
        }, {
          width: boardPx,
          height: boardPy,
          grid: true,
          debug: false
        });

        return api;
      }

      function drawSubgridGuides(b, { N, subRows, subCols, margin, cellSize, gap }) {
        // Draw vertical and horizontal thick lines between subgrids
        const SVG_NS = "http://www.w3.org/2000/svg";
        const total = N*cellSize + (N-1)*gap;
        const toCanvas = (offset) => margin + offset;

        const g = document.createElementNS(SVG_NS, "g");
        b.svg.appendChild(g);

        const drawLine = (x1, y1, x2, y2) => {
          const p = document.createElementNS(SVG_NS, "path");
          p.setAttribute("class", "subgrid-line");
          p.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
          // Put on top layer (notes group)
          b.svg.querySelector(".notes").appendChild(p);
        };

        // Vertical subgrid boundaries
        for (let c = subCols; c < N; c += subCols) {
          const offset = c*cellSize + (c-1)*gap + gap/2;
          const x = toCanvas(offset);
          drawLine(x, toCanvas(0), x, toCanvas(total));
        }
        // Horizontal subgrid boundaries
        for (let r = subRows; r < N; r += subRows) {
          const offset = r*cellSize + (r-1)*gap + gap/2;
          const y = toCanvas(offset);
          drawLine(toCanvas(0), y, toCanvas(total), y);
        }
      }

      // --- Kickoff: 2x1 single section (2 cells total) as requested ---
      window.sudoku = initSudoku("#sudoku", {
        subRows: 2,
        subCols: 2,
        singleSection: true,   // <-- enable special case
        cellSize: 110,
        gap: 32,
        margin: 36,
        hintShake: true,  // Set to false to disable hint shaking
        autosolver: false, // Enable autosolver - automatically set values when only one hint remains
        //maxHint: 2,
        correctValues: {
          "R1C1": 1,
          "R1C2": 2,
          // Add more correct values as needed
        }
      });

      // Example: programmatically toggle selection / hints (you can test in DevTools)
      // sudoku.setActive("R2C2");
      // sudoku.setHints("R2C2", [2,4]);
      // sudoku.clearHints("R4C4");
    })();
  </script>
</body>
</html>
