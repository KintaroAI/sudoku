<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blocks Sudoku</title>
<link rel="stylesheet" href="blocks_lib.css">
<style>
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui, Segoe UI, Roboto, Arial; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .canvas { background:#111519; border:1px solid #293039; border-radius:14px; overflow:hidden; }
  #sudoku { height: 760px; }

  /* Active/selected cell styling */
  .block.active rect {
    stroke: #8bd1ff;
    stroke-width: 3.5;
    filter: drop-shadow(0 0 6px rgba(139,209,255,.45));
  }

  /* Hints (3x3 pencil marks) */
  .sudoku-hints text {
    font-size: 13px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: middle;
    opacity: .95;
    pointer-events: none;
  }
  /* Per-digit hint colors (tweak to taste) */
  .sudoku-hints .hint-1 { fill: #F44336; } /* red */
  .sudoku-hints .hint-2 { fill: #E91E63; } /* pink */
  .sudoku-hints .hint-3 { fill: #9C27B0; } /* purple */
  .sudoku-hints .hint-4 { fill: #3F51B5; } /* indigo */
  .sudoku-hints .hint-5 { fill: #2196F3; } /* blue */
  .sudoku-hints .hint-6 { fill: #009688; } /* teal */
  .sudoku-hints .hint-7 { fill: #4CAF50; } /* green */
  .sudoku-hints .hint-8 { fill: #FFC107; } /* amber */
  .sudoku-hints .hint-9 { fill: #FF9800; } /* orange */

  /* Thicker subgrid guides (drawn as note blocks so they sit on top) */
  .subgrid-line { fill:none; stroke:#5a646e; stroke-width:3.5; opacity:.9; }
</style>
</head>
<body>
  <div class="wrap">
    <h2>Blocks Sudoku (draggable cells, selectable, colored hints)</h2>
    <div id="sudoku" class="canvas"></div>
  </div>

  <script src="blocks_lib.js"></script>
  <script>
    // ---- Sudoku bootstrap ----
    (function () {
      /**
       * Initialize a Sudoku board.
       * @param {String} container - CSS selector (e.g., "#sudoku")
       * @param {Object} opts
       *   subRows: subgrid rows (e.g., 2 in a 2x2 -> 4x4 board)
       *   subCols: subgrid cols (e.g., 2 in a 2x2 -> 4x4 board)
       *   cellSize: block width/height (px)
       *   gap: spacing between cells (px)
       *   margin: outer margin inside canvas (px)
       */
      function initSudoku(container, {
        subRows = 2,
        subCols = 2,
        cellSize = 100,
        gap = 8,
        margin = 15
      } = {}) {
        const N = subRows * subCols; // board dimension (e.g., 4, 9, 16...)
        const boardPx = margin*2 + N*cellSize + (N-1)*gap;

        const api = run_blocks(container, (b) => {
          // Helper: lay out NxN cells as blocks
          const blocks = [];
          for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
              const id = `R${r+1}C${c+1}`;
              const x = margin + c*(cellSize + gap);
              const y = margin + r*(cellSize + gap);
              const blk = b.addBlock(id, x, y, cellSize, cellSize, "");
              blocks.push(blk);

              // Click to select (single-active behavior)
              blk.g.addEventListener("click", (e) => {
                e.stopPropagation();
                setActive(blk.id);
              });

              // Create a "hints" overlay group inside each block
              const gHints = document.createElementNS("http://www.w3.org/2000/svg", "g");
              gHints.setAttribute("class", "sudoku-hints");
              blk.g.appendChild(gHints);
              blk._hintsEl = gHints;

              // API method: update hints (Set<number> or array)
              blk.setHints = (vals) => renderHints(blk, vals);
            }
          }

          // Canvas click clears selection
          b.svg.addEventListener("click", () => setActive(null));

          // Selection management
          let activeId = null;
          function setActive(id) {
            if (activeId && b.block(activeId)) {
              b.block(activeId).g.classList.remove("active");
            }
            activeId = id;
            if (id && b.block(id)) {
              b.block(id).g.classList.add("active");
            }
          }

          // Render hints: draw a 3x3 grid of tiny digits (1..9) colored per number.
          function renderHints(blk, values) {
            const set = new Set(values || []);
            const g = blk._hintsEl;
            g.replaceChildren();

            // Cell inner box
            const pad = 10; // inner padding
            const w = blk.w - pad*2;
            const h = blk.h - pad*2;

            const cellW = w / 3;
            const cellH = h / 3;

            // Positions for digits 1..9 in row-major 3x3
            for (let d = 1; d <= 9; d++) {
              const idx = d - 1;
              const rr = Math.floor(idx / 3);
              const cc = idx % 3;
              const cx = blk.x + pad + cc*cellW + cellW/2;
              const cy = blk.y + pad + rr*cellH + cellH/2;

              if (set.has(d)) {
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", cx);
                t.setAttribute("y", cy);
                t.setAttribute("class", `hint-${d}`);
                t.textContent = d.toString();
                g.appendChild(t);
              }
            }
          }

          // Subgrid guide lines (as "notes" so they sit topmost)
          drawSubgridGuides(b, { N, subRows, subCols, margin, cellSize, gap });

          // Demo: seed a few hints so you can see the feature
          // (You can replace these with your own later)
          const demo = [
            { at: "R1C1", hints: [1,3,4] },
            { at: "R2C3", hints: [2,5,6,9] },
            { at: "R3C2", hints: [7,8]   },
            { at: "R4C4", hints: [1,2,3,4,5,6,7,8,9] }
          ]; // Show hints for all grid sizes
          for (const {at, hints} of demo) {
            const blk = b.block(at);
            if (blk) blk.setHints(hints);
          }

          // Expose a tiny control API on the diagram object for later tinkering
          b.sudoku = {
            setActive,
            setHints(id, arr) { const blk = b.block(id); if (blk) blk.setHints(arr); },
            clearHints(id) { const blk = b.block(id); if (blk) blk.setHints([]); },
            size: N
          };
        }, {
          width: boardPx,
          height: boardPx,
          grid: true,
          debug: false
        });

        return api;
      }

      function drawSubgridGuides(b, { N, subRows, subCols, margin, cellSize, gap }) {
        // Draw vertical and horizontal thick lines between subgrids
        const SVG_NS = "http://www.w3.org/2000/svg";
        const total = N*cellSize + (N-1)*gap;
        const toCanvas = (offset) => margin + offset;

        const g = document.createElementNS(SVG_NS, "g");
        b.svg.appendChild(g);

        const drawLine = (x1, y1, x2, y2) => {
          const p = document.createElementNS(SVG_NS, "path");
          p.setAttribute("class", "subgrid-line");
          p.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
          // Put on top layer (notes group)
          b.svg.querySelector(".notes").appendChild(p);
        };

        // Vertical subgrid boundaries
        for (let c = subCols; c < N; c += subCols) {
          const offset = c*cellSize + (c-1)*gap + gap/2;
          const x = toCanvas(offset);
          drawLine(x, toCanvas(0), x, toCanvas(total));
        }
        // Horizontal subgrid boundaries
        for (let r = subRows; r < N; r += subRows) {
          const offset = r*cellSize + (r-1)*gap + gap/2;
          const y = toCanvas(offset);
          drawLine(toCanvas(0), y, toCanvas(total), y);
        }
      }

      // --- Kickoff: 2x2 subgrid (4x4 board) as requested ---
      window.sudoku = initSudoku("#sudoku", {
        subRows: 2,
        subCols: 2,
        cellSize: 110,
        gap: 32,
        margin: 36
      });

      // Example: programmatically toggle selection / hints (you can test in DevTools)
      // sudoku.setActive("R2C2");
      // sudoku.setHints("R2C2", [2,4]);
      // sudoku.clearHints("R4C4");
    })();
  </script>
</body>
</html>
