<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blocks Sudoku</title>
<link rel="stylesheet" href="blocks_lib.css">
<link rel="stylesheet" href="sudoku.css">
<style>
  html, body { height:100%; margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui, Segoe UI, Roboto, Arial; }
  #sudoku { height: 950px; }
</style>
</head>
<body>
  <div class="wrap">
    <h2>Quantum Sudoku - https://github.com/KintaroAI/sudoku</h2>
    <div id="sudoku" class="canvas"></div>
  </div>

  <script src="blocks_lib.js"></script>
  <script src="sudoku.js"></script>
  <script>
    // Initialize the Sudoku game
    window.sudoku = initSudoku("#sudoku", {
      subRows: 4,
      subCols: 4,
      singleSection: false,
      cellSize: 110,
      gap: 32,
      margin: 36,
      hintShake: true,
      autosolver: true,
      clickToSetAnswer: true,
      autoHints: true,
      correctValues: {
        // Add correct values as needed
      }
    });

    // Example: Control autosolver and autoHints at runtime
    // sudoku.setAutosolver(false);  // Disable autosolver
    // sudoku.setAutoHints(false);   // Disable automatic hint updates
    // console.log(sudoku.getAutosolver()); // Check autosolver state
    // console.log(sudoku.getAutoHints());  // Check autoHints state
  </script>
</body>
</html>
